[package]
name = "ancs-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
bluer = { version = "0.17.3", features = ["bluetoothd"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
notify-rust = { version = "4.11.6", default-features = false, features = ["d"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.49", features = ["formatting", "parsing"] }
toml = "1.1.2"
tokio = { version = "1.52.3", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[[test]]
name = "hardware_smoke"
path = "tests/hardware_smoke.rs"
harness = true
