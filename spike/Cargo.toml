[package]
name = "ancs-feasibility-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.103"
bluer = { version = "0.17.3", features = ["bluetoothd"] }
futures = "0.3.31"
notify-rust = { version = "4.11.6", default-features = false, features = ["d"] }
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "time"] }

